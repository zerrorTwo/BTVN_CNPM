services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bt07_cart_db
    ports:
      - "3308:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    networks:
      - bt07-network

volumes:
  mysqldata:

networks:
  bt07-network:
    driver: bridge
